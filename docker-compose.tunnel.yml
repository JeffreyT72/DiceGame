services:
  blackjack:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Redis leaderboard cache disabled for now; without REDIS_URL the leaderboard reads SQLite.
      # To re-enable: set REDIS_URL: redis://redis:6379, add depends_on: [redis], uncomment the service below.
    volumes:
      - ./data:/app/data
    networks:
      default:
      tunnel:
        aliases:
          - blackjack

  # Leaderboard cache only; safe to lose, so no volume. Not on the tunnel network.
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped

networks:
  tunnel:
    name: blackjack-tunnel
